<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benvenuto</title>
    <link rel="stylesheet" href="style_login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="form-login">
        <input type="text" id="username-login" placeholder="username">
        <input type="password" id="password-login" placeholder="password">
        <button id="btn-login">Login</button>
        <p class="err">Errore</p>
    </div>
    <div id="form-registrazione">
        <input type="text" id="username-registrazione" placeholder="username">
        <input type="password" id="password-registrazione" placeholder="password">
        <button id="btn-registrazione">Registrati</button>
        <p class="err">Errore</p>
    </div>
    <label id="switch_label">Non sei registrato?</label>
    <button id="switch">Clicca qui</button>
    <script src="sw_register.js"></script>
    <script src="script_login.js"></script>
</body>
</html>
