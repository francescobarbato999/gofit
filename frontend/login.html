<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Benvenuto</title>
    <link rel="stylesheet" href="style_login.css">
</head>
<body>
    <div id="form-login">
        <input type="email" id="email-login" placeholder="email"><br>
        <input type="password" id="password-login" placeholder="password"><br>
        <button id="btn-login">Login</button>
        <p class="err">Errore</p>
    </div>
    <div id="form-registrazione">
        <input type="email" id="email-registrazione" placeholder="email"><br>
        <input type="password" id="password-registrazione" placeholder="password"><br>
        <button id="btn-registrazione">Registrati</button>
        <p class="err">Errore</p>
    </div>
    <label id="switch_label">Non sei registrato?</label><br>
    <button id="switch">Clicca qui</button>
    <script src="script_login.js"></script>
</body>
</html>
